name: Feature request
description: 想加什么能力
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        这个项目的边界：只做**编辑辅助**（扫描、改动清单、审批、门禁、设定/节拍/文风辅助），不做代写整本、不覆盖主稿。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 说场景，不要说方案
      placeholder: 例：我改了 40 处，想知道每一处改前改后的 diff。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你想到的做法（可选）
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 大概属于哪块
      options:
        - 引擎（扫描/评分/门禁）
        - 改写契约
        - 知识库
        - 情节
        - 文风
        - 面板 UI
        - 数据格式 / 规则包
        - 文档 / 工程
        - 不确定
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现在怎么绕过
      description: 现有功能里有没有近似做法
    validations:
      required: false
